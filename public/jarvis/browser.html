<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis Browser</title>
<style>
  html,body{height:100%;margin:0;background:#03080d;color:#e4f3fc;font-family:Arial,Helvetica,sans-serif}
  body{display:grid;place-items:center;text-align:center}
  b{display:block;font-size:22px;letter-spacing:6px}
  span{display:block;margin-top:14px;font-size:10px;letter-spacing:3px;color:#7792a3}
  i{display:block;width:8px;height:8px;margin:0 auto 26px;border-radius:50%;background:#78d3ff;box-shadow:0 0 18px #78d3ff;animation:p 1.6s infinite}
  @keyframes p{50%{opacity:.25}}
  @media(prefers-reduced-motion:reduce){i{animation:none}}
</style>
</head>
<body><div><i></i><b>JARVIS BROWSER</b><span>BEREIT · HIER ZEIGT JARVIS, WAS ER FINDET</span></div></body>
</html>
